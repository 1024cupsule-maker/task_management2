<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>タスク管理2</title>

  <!-- PWA / スマホ設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タスク管理2">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-sky-400 text-lg"></i>
        <h1 class="font-bold text-base tracking-wide">タスク管理 2</h1>
      </div>
      <span id="taskCountBadge" class="text-xs bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-full">未完了 0 件</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-xl mx-auto w-full px-4 py-4 flex-1 flex flex-col gap-4">

    <!-- 入力フォーム -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <form id="todoForm" class="flex flex-col gap-3">
        <input 
          type="text" 
          id="taskTitle" 
          placeholder="タスク・ナレッジを入力..." 
          required 
          autocomplete="off"
          class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-700 text-sm placeholder:text-slate-400
