<script>
  // カテゴリ定義と配色
  const CATEGORIES = {
    work_task: {
      label: '仕事タスク',
      badgeClass: 'bg-blue-600 text-white'
    },
    life_task: {
      label: '生活タスク',
      badgeClass: 'bg-emerald-600 text-white'
    },
    work_knowledge: {
      label: '仕事ナレッジ',
      badgeClass: 'bg-sky-100 text-sky-800 border border-sky-300'
    },
    home_knowledge: {
      label: '家庭ナレッジ',
      badgeClass: 'bg-emerald-100 text-emerald-800 border border-emerald-300'
    },
    yomoyama: {
      label: 'よもやま',
      badgeClass: 'bg-amber-500 text-slate-900 font-semibold'
    }
  };

  const STORAGE_KEY = 'taskflow_v2_storage';
  let tasks = [];
  try {
    tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    tasks = [];
  }

  // フィルタ状態
  let selectedPeriod = 'all';
  let selectedCategory = 'all';
  let showCompleted = false;

  // DOM
  const form = document.getElementById('todoForm');
  const titleInput = document.getElementById('taskTitle');
  const categoryInput = document.getElementById('taskCategory');
  const dueDateInput = document.getElementById('taskDueDate');
  const taskList = document.getElementById('taskList');
  const taskCount = document.getElementById('taskCount');
  const clearCompletedBtn = document.getElementById('clearCompletedBtn');
  const showActiveBtn = document.getElementById('showActiveBtn');
  const showDoneBtn = document.getElementById('showDoneBtn');
  const periodBtns = document.querySelectorAll('.period-btn');
  const catBtns = document.querySelectorAll('.cat-btn');

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    render();
  }

  // フィルターボタンスタイル更新
  function updateFilterButtonsUI() {
    periodBtns.forEach(b => {
      const active = b.dataset.period === selectedPeriod;
      b.className = `period-btn px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors whitespace-nowrap ${
        active ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200'
      }`;
    });

    catBtns.forEach(b => {
      const active = b.dataset.cat === selectedCategory;
      b.className = `cat-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border transition-colors whitespace-nowrap ${
        active ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200'
      }`;
    });

    showActiveBtn.className = `px-2.5 py-1 rounded-md font-medium transition-all ${
      !showCompleted ? 'text-slate-800 bg-white shadow-sm' : 'text-slate-600'
    }`;
    showDoneBtn.className = `px-2.5 py-1 rounded-md font-medium transition-all ${
      showCompleted ? 'text-slate-800 bg-white shadow-sm' : 'text-slate-600'
    }`;
  }

  // タスク追加
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) return;

    const newTask = {
      id: Date.now(),
      title: title,
      category: categoryInput.value,
      dueDate: dueDateInput.value || null,
      completed: false,
      createdAt: new Date().toISOString()
    };

    tasks.unshift(newTask);

    // 登録直後は「未完了」一覧で確実に表示されるようフィルターをリセット
    showCompleted = false;
    selectedPeriod = 'all';
    selectedCategory = 'all';
    updateFilterButtonsUI();

    titleInput.value = '';
    dueDateInput.value = '';
    saveTasks();
  });

  window.toggleTask = function(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveTasks();
  };

  window.deleteTask = function(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
  };

  clearCompletedBtn.addEventListener('click', () => {
    if (confirm('完了済みの項目をすべて削除しますか？')) {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
    }
  });

  showActiveBtn.addEventListener('click', () => {
    showCompleted = false;
    updateFilterButtonsUI();
    render();
  });

  showDoneBtn.addEventListener('click', () => {
    showCompleted = true;
    updateFilterButtonsUI();
    render();
  });

  periodBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPeriod = btn.dataset.period;
      updateFilterButtonsUI();
      render();
    });
  });

  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedCategory = btn.dataset.cat;
      updateFilterButtonsUI();
      render();
    });
  });

  // 日付補助: YYYY-MM-DD 文字列を返す
  function formatYMD(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // 時期判定（文字列ベースで安全に比較）
  function matchesPeriod(dueDateStr, period) {
    if (period === 'all') return true;
    if (!dueDateStr) return false;

    const today = new Date();
    const todayStr = formatYMD(today);

    if (period === 'today') {
      return dueDateStr <= todayStr;
    }

    if (period === 'tomorrow') {
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      return dueDateStr <= formatYMD(tomorrow);
    }

    if (period === 'this_week') {
      const day = today.getDay(); // 0(日)〜6(土)
      const daysUntilSunday = (7 - day) % 7;
      const sunday = new Date(today);
      sunday.setDate(today.getDate() + daysUntilSunday);
      return dueDateStr <= formatYMD(sunday);
    }

    if (period === 'this_month') {
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      return dueDateStr <= formatYMD(lastDay);
    }

    return true;
  }

  // 描画
  function render() {
    let filtered = tasks.filter(t => Boolean(t.completed) === showCompleted);

    if (selectedCategory !== 'all') {
      filtered = filtered.filter(t => t.category === selectedCategory);
    }

    if (selectedPeriod !== 'all') {
      filtered = filtered.filter(t => matchesPeriod(t.dueDate, selectedPeriod));
    }

    const activeTotal = tasks.filter(t => !t.completed).length;
    taskCount.textContent = `未完了 ${activeTotal} 件`;
    clearCompletedBtn.classList.toggle('hidden', !tasks.some(t => t.completed));

    if (filtered.length === 0) {
      taskList.innerHTML = `
        <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
          <i class="fa-regular fa-folder-open text-3xl mb-2 stroke-1"></i>
          <p class="text-xs">該当する項目はありません</p>
        </div>
      `;
      return;
    }

    taskList.innerHTML = filtered.map(t => {
      const catConfig = CATEGORIES[t.category] || CATEGORIES.work_task;
      return `
        <li class="bg-white p-3.5 rounded-2xl border border-slate-200/90 shadow-sm flex items-start gap-3 transition-all">
          <button onclick="toggleTask(${t.id})" class="mt-0.5 text-lg ${t.completed ? 'text-slate-400' : 'text-slate-300 hover:text-slate-500'}">
            <i class="fa-${t.completed ? 'solid fa-circle-check text-slate-500' : 'regular fa-circle'}"></i>
          </button>
          
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium leading-relaxed break-words ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
              ${escapeHtml(t.title)}
            </p>
            
            <div class="flex flex-wrap items-center gap-2 mt-2">
              <span class="text-[10px] px-2 py-0.5 rounded-md ${catConfig.badgeClass}">
                ${catConfig.label}
              </span>

              ${t.dueDate ? `
                <span class="text-[11px] text-slate-500 flex items-center gap-1 font-sans">
                  <i class="fa-regular fa-calendar text-[10px]"></i> ${t.dueDate}
                </span>
              ` : `
                <span class="text-[10px] text-slate-400">期日なし</span>
              `}
            </div>
          </div>

          <button onclick="deleteTask(${t.id})" class="text-slate-300 hover:text-rose-500 p-1">
            <i class="fa-regular fa-trash-can text-sm"></i>
          </button>
        </li>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  updateFilterButtonsUI();
  render();
</script>
